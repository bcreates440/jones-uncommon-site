# Cloudflare hosting for this site.
#
# The site is plain static files - this is NOT a server. Cloudflare's build
# runs Jekyll on every push to main (build command:
# `bundle install && bundle exec jekyll build`), then serves the finished
# _site folder. Commercial sites are allowed on Cloudflare's free tier;
# GitHub Pages does not allow being used as hosting for a paid service,
# which is why this moved here. See ops/design/hosting-decision.md.
name = "jones-uncommon-site"
compatibility_date = "2026-10-20"

[assets]
directory = "./_site"
# Serves work.html at /work and the homepage at /, and redirects any old
# /work.html link there. So every link, canonical tag and sitemap entry on
# the site is written extensionless - check.rb expects that.
html_handling = "auto-trailing-slash"
