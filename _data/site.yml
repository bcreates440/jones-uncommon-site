# ===========================================================================
#  THE FACTS THAT APPEAR EVERYWHERE
#
#  Change something here and it changes on every page at once - the footer,
#  the buttons, and the data Google reads.
#
#  Anything in here can also be edited in the website editor at /admin/
#  under "Site-wide details".
# ===========================================================================

org_name:   "Jones Uncommon"
org_blurb:  "Simple, affordable websites you own."

# --- how people reach them --------------------------------------------------
# Sits in the footer's contact block where a street address normally goes.
# Deliberately names no location - Jones Uncommon is remote-first and isn't
# chasing local map rankings for itself. (Client sites are the opposite: they
# ARE local businesses, so a real address here matters for their search
# results - see the footer.html comment about NAP consistency.)
address:      "Remote-first. Quick, straightforward website work, wherever you are."
# TODO(Blake): real inbox once jonesuncommon.com exists (or use one now).
email:        "hello@jonesuncommon.com"

# Written out for people, again in the format a phone dials, and again as a
# link a button can point at. ALL THREE must be changed together.
# (Currently Blake's personal line; swap in a Google Voice number later.)
phone:        "(208) 550-7477"
phone_dial:   "+12085507477"
phone_href:   "tel:+12085507477"

# The email again, as a link a button can point at. Change with `email` above.
email_href:   "mailto:hello@jonesuncommon.com"

# --- elsewhere on the web ----------------------------------------------------
facebook:     ""
instagram:    ""

# The colour a mobile browser tints its own chrome with. Keep it the same as
# --brand in css/styles.css. (It cannot read the CSS token, so it is the one
# colour that has to be stated twice - change both together.)
theme_color:  "#291F1E"

# --- the picture used when a link is shared on Facebook etc. ----------------
share_image:  "images/logo.png"
